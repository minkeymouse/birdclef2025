      Pseudo iter 1 catastrophically failed (-0.016). Same magnitude as our
      legacy v3 pseudo failure (-0.018). Sydorskyi recipe DID NOT transfer.

      Likely causes:
      (1) Filter threshold 0.5 kept 52% chunks (vs Sydorskyi's 16% at I1).
          Our exp171 teacher overconfident on unlabeled SS → pseudo includes
          much noise. Need MUCH higher threshold (0.7-0.8) for our teacher.
      (2) Teacher = exp171 (LB 0.937, slightly anti-correlated). Bad teacher
          → bad pseudo. Need exp169 (LB 0.938) as teacher OR multi-arch ensemble.
      (3) 40% pseudo per batch too aggressive. Sydorskyi I1 used MixUp at
          sample level (40% chance), not 40% of batch.
      (4) Cross-fold-OOF strategy NOT enforced. Sydorskyi held out fold's
          labels from teacher generating that fold's pseudo. We didn't do this.
          → leak from labeled SS through pseudo.

      Iteration 2 plan: SAVE slot 5 today. Tomorrow restart pseudo with:
      - Teacher = exp169 (LB-best, less labeled-SS-fit)
      - Filter threshold 0.7 (more conservative)
      - Pseudo at sample level (40% MixUp partner draws, not 40% of batch)
      - Fold-OOF enforcement

