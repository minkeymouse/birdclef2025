      Robin Hood pattern is REAL on labeled SS (audit confirmed mathematically) but
      DOESN'T TRANSFER to hidden test. Possible reasons:
      (1) Audit's S23 fepowl FP cluster is site-specific; hidden test sites have
          different acoustic environments where fepowl can genuinely be present.
      (2) Rule's rank-pct threshold (top 1.5%) on Mattia's pipeline output catches
          rows whose fepowl prediction is high for OTHER reasons (not insect-chorus
          confusion).
      (3) Anti-correlation invariant: rules fitted on labeled SS sites may inversely
          predict on unseen test sites. Local +0.003 → LB -0.002 = anti-correlation.

